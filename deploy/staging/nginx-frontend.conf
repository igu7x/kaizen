# Config nginx do container do frontend Kaizen.
#
# Responsabilidades:
#   1) Servir os arquivos estáticos do React (saída de `vite build` → /dist)
#   2) Proxy /api/*  → backend (Service ClusterIP interno do OpenShift)
#   3) Fallback SPA: qualquer rota desconhecida retorna index.html (pro React Router)

worker_processes auto;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Pastas writable pelo random UID do OpenShift
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    # Compressão (textos costumam comprimir ~70-80%)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # Headers básicos de segurança
    server_tokens off;

    # Log JSON pra Loki / ELK facilitar
    log_format json escape=json
        '{'
            '"ts":"$time_iso8601",'
            '"req_id":"$request_id",'
            '"method":"$request_method",'
            '"path":"$request_uri",'
            '"status":$status,'
            '"bytes":$body_bytes_sent,'
            '"upstream_time":"$upstream_response_time",'
            '"user_agent":"$http_user_agent"'
        '}';
    access_log /var/log/nginx/access.log json;

    # ============================================================
    # Upstream do backend Java (Service interno ClusterIP)
    # ============================================================
    upstream kaizen_backend {
        # Nome do Service do backend dentro do mesmo namespace.
        # Ajustar se a infra renomear.
        server kaizen-backend:8081;
        keepalive 32;
    }

    server {
        listen 8080;
        server_name _;
        root /opt/app-root/src;
        index index.html;

        # ============================================================
        # PROXY de /api/* para o backend Java
        # ============================================================
        location /api/ {
            proxy_pass http://kaizen_backend;
            proxy_http_version 1.1;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection        "";

            # Timeouts generosos pra geração de PDF / queries pesadas.
            proxy_connect_timeout 5s;
            proxy_send_timeout   120s;
            proxy_read_timeout   120s;

            # Upload de anexos pode ser grande
            client_max_body_size 20m;
        }

        # ============================================================
        # /actuator/* também vai pro backend (Spring Boot Actuator)
        # ============================================================
        location /actuator/ {
            proxy_pass http://kaizen_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # ============================================================
        # Healthcheck do container (200 OK, sem tocar no backend)
        # ============================================================
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        # ============================================================
        # Cache agressivo pros assets versionados do Vite
        # (arquivos com hash no nome, ex.: index-a1b2c3d4.js)
        # ============================================================
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # ============================================================
        # SPA fallback: qualquer rota desconhecida → index.html
        # Isso faz o React Router funcionar em refresh / deep links.
        # ============================================================
        location / {
            # Nunca cachear o index.html (precisa pegar versão nova após deploy)
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            try_files $uri $uri/ /index.html;
        }
    }
}
