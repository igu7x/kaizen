# Manifestos do FRONTEND React em STAGING.
# Esta é a parte PÚBLICA — a Route fica exposta.
# O nginx do container serve os arquivos estáticos do React e faz proxy de
# /api/* e /actuator/* para o backend (kaizen-backend ClusterIP).
#
# Placeholders a substituir:
#   <<NAMESPACE>>          — namespace de staging
#   <<IMAGE_FRONTEND>>     — image:tag do frontend (vem do CI)
#   <<HOST>>               — hostname público (ex: kaizen-stag.apps.ocp-prd.tjgo.jus.br)

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kaizen-frontend
  namespace: <<NAMESPACE>>
  labels:
    app: kaizen-frontend
    component: monorepo
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: kaizen-frontend
  template:
    metadata:
      labels:
        app: kaizen-frontend
        component: monorepo
    spec:
      containers:
        - name: nginx
          image: <<IMAGE_FRONTEND>>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true

---
apiVersion: v1
kind: Service
metadata:
  name: kaizen-frontend
  namespace: <<NAMESPACE>>
  labels:
    app: kaizen-frontend
    component: monorepo
spec:
  type: ClusterIP
  selector:
    app: kaizen-frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP

---
# Route pública — esta é a URL que o usuário acessa no navegador.
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: kaizen-frontend
  namespace: <<NAMESPACE>>
  labels:
    app: kaizen-frontend
    component: monorepo
spec:
  host: <<HOST>>
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect
  to:
    kind: Service
    name: kaizen-frontend
    weight: 100
  wildcardPolicy: None
