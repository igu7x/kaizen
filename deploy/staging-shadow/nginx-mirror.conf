# Config nginx para shadow traffic — Fase 1 (100% GET, mesmo banco)
#
# Esta config substitui (ou estende) o bloco `server` do ingress nginx em
# STAGING que hoje serve a API do Kaizen Node. NÃO usar em produção.
#
# Premissa:
#   - O Node atual está em http://kaizen-api-node:8080 (Service ClusterIP) ou
#     similar dentro do cluster.
#   - O Java (deploy desta entrega) está em http://kaizen-api-java:8081.
#
# Substituir os upstreams pelos endereços reais (Service do Node e Service do
# Java). Se o ingress for um nginx-ingress-controller padrão do OpenShift,
# este conteúdo pode entrar como `nginx.ingress.kubernetes.io/server-snippet`
# (ver README).

upstream kaizen_node {
    server kaizen-api-node:8080;
    keepalive 32;
}

upstream kaizen_java {
    server kaizen-api-java:8081;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;

    # Timeouts conservadores — o shadow não pode bloquear o caminho crítico.
    proxy_connect_timeout 3s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # ============================================================
    # Caminho primário — tudo vai para o Node (responde ao usuário)
    # ============================================================
    location / {
        proxy_pass http://kaizen_node;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # ============================================================
        # Shadow — espelha só GETs em /api/* para o Java.
        # mirror_request_body OFF garante que o body NÃO é replicado
        # (Fase 1 é read-only; GETs não têm body relevante mesmo).
        # ============================================================
        mirror /__shadow;
        mirror_request_body off;
    }

    # ============================================================
    # Bloco interno do mirror — só nginx chama, nunca o cliente.
    # ============================================================
    location = /__shadow {
        internal;

        # Bloqueia métodos que mutam — Fase 1 valida só leitura.
        # POST/PUT/PATCH/DELETE chegam aqui via mirror, mas retornamos 204
        # imediatamente, sem nunca chamar o Java.
        if ($request_method !~ ^(GET|HEAD)$) {
            return 204;
        }

        # Só espelha endpoints da API (não estáticos, healthchecks, etc).
        if ($request_uri !~ ^/api/) {
            return 204;
        }

        proxy_pass http://kaizen_java$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Shadow          "1";
        proxy_set_header Connection        "";

        # Timeouts MAIS curtos pro shadow — não pode atrasar resposta do Node.
        # Se o Java estiver lento, o nginx desiste e segue a vida.
        proxy_connect_timeout 1s;
        proxy_send_timeout    5s;
        proxy_read_timeout    5s;

        # Resposta do shadow é descartada pelo nginx automaticamente.
        # Para coleta A/B, logar status + path + size do shadow num access_log
        # separado (formato JSON facilita parser):
        access_log /var/log/nginx/shadow_access.log shadow_json;
    }
}

# Formato de log JSON para a coleta A/B. Pareie cada par (request_id) com a
# resposta correspondente do upstream Node usando $request_id (vem do header
# nativo do nginx). A análise é offline (Loki/ELK/script).
log_format shadow_json escape=json
    '{'
        '"ts":"$time_iso8601",'
        '"req_id":"$request_id",'
        '"method":"$request_method",'
        '"path":"$request_uri",'
        '"status":$status,'
        '"upstream":"java",'
        '"bytes_sent":$body_bytes_sent,'
        '"upstream_response_time":"$upstream_response_time"'
    '}';
